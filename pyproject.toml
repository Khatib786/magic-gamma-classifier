[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magic-classifier"
version = "1.0.0"
description = "Physics-informed gamma/hadron separation on the UCI MAGIC Gamma Telescope dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Khatib Kabir" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
full = ["lightgbm>=4.0", "optuna>=3.0", "ucimlrepo>=0.0.3"]
dev = ["pytest>=7.4"]

[project.scripts]
magic-classifier = "magic_classifier.pipeline:cli"

[tool.setuptools.packages.find]
where = ["src"]
